<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title description">
  <title id="title">온실 효과와 복사 에너지의 이동</title>
  <desc id="description">태양 복사가 지표를 데운다. 지표의 복사 일부는 우주로 나가고, 일부는 온실 기체에 흡수된 뒤 지표와 우주 방향으로 재복사된다.</desc>
  <defs>
    <marker id="sun-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b97900"/>
    </marker>
    <marker id="earth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b33324"/>
    </marker>
  </defs>
  <rect width="1000" height="550" fill="#ffffff"/>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">
    <text x="500" y="38" font-size="26" font-weight="700" fill="#172333">온실 효과</text>
    <text x="500" y="70" font-size="17" fill="#465365">화살표는 복사 에너지의 이동 방향을 나타냅니다.</text>
    <text x="500" y="111" font-size="20" font-weight="700" fill="#465365">우주</text>
    <rect x="40" y="200" width="920" height="135" rx="18" fill="#eaf4fb" stroke="#8ba9ca" stroke-width="2"/>
    <rect x="352" y="235" width="296" height="66" rx="12" fill="#ffffff" stroke="#8ba9ca" stroke-width="2"/>
    <text x="500" y="264" font-size="21" font-weight="700" fill="#172333">온실 기체</text>
    <text x="500" y="288" font-size="16" fill="#465365">지구 복사의 일부 흡수</text>
    <rect x="40" y="425" width="920" height="65" rx="12" fill="#d9edcf" stroke="#83a479" stroke-width="2"/>
    <text x="500" y="466" font-size="23" font-weight="700" fill="#274b26">지표</text>
    <path d="M 160 125 V 412" fill="none" stroke="#b97900" stroke-width="5" marker-end="url(#sun-arrow)"/>
    <text x="180" y="158" text-anchor="start" font-size="19" font-weight="700" fill="#8a5a00">태양 복사</text>
    <path d="M 410 412 V 310" fill="none" stroke="#b33324" stroke-width="5" marker-end="url(#earth-arrow)"/>
    <text x="331" y="365" font-size="18" font-weight="700" fill="#b33324">지표 복사</text>
    <path d="M 570 310 V 412" fill="none" stroke="#b33324" stroke-width="5" marker-end="url(#earth-arrow)"/>
    <text x="658" y="365" font-size="18" font-weight="700" fill="#b33324">지표로 재복사</text>
    <path d="M 500 227 V 138" fill="none" stroke="#b33324" stroke-width="5" marker-end="url(#earth-arrow)"/>
    <text x="604" y="184" font-size="18" font-weight="700" fill="#b33324">우주로 재복사</text>
    <path d="M 840 412 V 138" fill="none" stroke="#b33324" stroke-width="5" marker-end="url(#earth-arrow)"/>
    <text x="820" y="158" text-anchor="end" font-size="18" font-weight="700" fill="#b33324">일부는 우주로</text>
    <text x="500" y="525" font-size="17" fill="#465365">이해를 돕기 위해 일부 에너지 이동만 나타낸 모식도</text>
  </g>
</svg>
