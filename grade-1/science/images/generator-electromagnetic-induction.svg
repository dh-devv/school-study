<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title description">
  <title id="title">간이 발전기와 전자기 유도</title>
  <desc id="description">자석이 코일 안에서 회전하면 코일을 통과하는 자기장이 변한다. 전자기 유도로 회로에 전류가 흘러 발광 다이오드가 빛난다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1757a6"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b97900"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536579"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" fill="#172333">
    <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700">간이 발전기와 전자기 유도</text>
    <text x="600" y="85" text-anchor="middle" font-size="18" fill="#465365">자석의 회전으로 코일을 지나는 자기장이 변하고, 회로에 전류가 흐른다.</text>

    <rect x="55" y="120" width="1090" height="420" rx="22" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="160" font-size="21" font-weight="700">1. 자석을 돌리면 코일을 통과하는 자기장이 변한다</text>

    <path d="M 350 280 C 350 205, 840 205, 840 280" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <path d="M 840 355 C 840 430, 350 430, 350 355" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <text x="595" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#465365">회전</text>

    <ellipse cx="595" cy="320" rx="225" ry="92" fill="none" stroke="#1757a6" stroke-width="5"/>
    <ellipse cx="595" cy="320" rx="190" ry="76" fill="none" stroke="#4d83c4" stroke-width="4"/>
    <ellipse cx="595" cy="320" rx="155" ry="60" fill="none" stroke="#83a9d8" stroke-width="4"/>
    <text x="895" y="312" font-size="20" font-weight="700" fill="#1757a6">고정된 코일</text>
    <path d="M 875 320 L 820 320" fill="none" stroke="#1757a6" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="495" y="288" width="100" height="64" rx="8" fill="#ffffff" stroke="#172333" stroke-width="2"/>
    <path d="M 545 289 V 351" stroke="#ffffff" stroke-width="4"/>
    <path d="M 495 288 H 545 V 352 H 495 Z" fill="#d95c4f"/>
    <path d="M 545 288 H 595 V 352 H 545 Z" fill="#3977b8"/>
    <text x="520" y="329" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">N</text>
    <text x="570" y="329" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">S</text>
    <text x="545" y="390" text-anchor="middle" font-size="18" font-weight="700">회전하는 자석</text>

    <path d="M 380 320 H 455" fill="none" stroke="#b97900" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow-gold)"/>
    <path d="M 810 320 H 735" fill="none" stroke="#b97900" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow-gold)"/>
    <text x="595" y="474" text-anchor="middle" font-size="18" fill="#8a5a00">자기장의 변화</text>

    <path d="M 595 550 V 575" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <rect x="100" y="590" width="1000" height="190" rx="18" fill="#eef5fb" stroke="#8ba9ca" stroke-width="2"/>
    <text x="600" y="625" text-anchor="middle" font-size="21" font-weight="700">2. 전자기 유도로 전류가 생기고 발광 다이오드가 켜진다</text>
    <rect x="175" y="650" width="210" height="52" rx="12" fill="#ffffff" stroke="#8ba9ca" stroke-width="2"/>
    <text x="280" y="683" text-anchor="middle" font-size="19" font-weight="700">자기장 변화</text>
    <path d="M 405 676 H 480" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <rect x="500" y="650" width="190" height="52" rx="12" fill="#ffffff" stroke="#8ba9ca" stroke-width="2"/>
    <text x="595" y="683" text-anchor="middle" font-size="19" font-weight="700">유도 전류</text>
    <path d="M 710 676 H 795" fill="none" stroke="#536579" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <circle cx="850" cy="674" r="19" fill="#ffd367" stroke="#b97900" stroke-width="3"/>
    <path d="M 837 691 L 863 691 L 858 704 L 842 704 Z" fill="#d95c4f"/>
    <path d="M 850 642 V 633 M 824 650 L 818 644 M 876 650 L 882 644" fill="none" stroke="#b97900" stroke-width="3"/>
    <text x="930" y="682" font-size="19" font-weight="700">빛에너지</text>
    <text x="600" y="748" text-anchor="middle" font-size="18" fill="#465365">자석의 운동 에너지 → 전기 에너지 → 빛에너지</text>
  </g>
</svg>
